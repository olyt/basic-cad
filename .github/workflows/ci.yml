name: CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Checks, tests, build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Read repository files
              uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Set up Python for DXF checks
              uses: actions/setup-python@v7.0.0
              with:
                  python-version-file: tools/dxf-check/.python-version
                  cache: pip
                  cache-dependency-path: tools/dxf-check/requirements.txt

            - name: Install DXF checker dependencies
              run: |
                  python -m venv tools/dxf-check/.venv
                  tools/dxf-check/.venv/bin/python -m pip install -r tools/dxf-check/requirements.txt

            - name: Check types, lint, and formatting
              run: npm run check

            - name: Run tests
              run: npm test

            - name: Test DXF checker
              run: npm run test:dxf-check

            - name: Build application
              run: npm run build
